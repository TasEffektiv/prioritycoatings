<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact Us — Priority One Coatings</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Static, non-JS shadow copy of the "Contact Us Page Form" rendered by
      src/components/ContactForm.tsx (used on /contact-us).

      This file exists purely so Netlify's build-time form scanner can see
      and register the form: the real form is a client component rendered
      by an SSR route, which Netlify's forms proxy cannot intercept. The
      React form's AJAX submission POSTs to this same file's path
      (/forms/contact-us.html) so submissions land against the form
      registered here. Keep the name and every field's "name" attribute in
      sync with ContactForm.tsx if that component changes.
    -->
    <form name="Contact Us Page Form" method="POST" data-netlify="true" netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="Contact Us Page Form" />
      <p style="position: absolute; left: -9999px; top: -9999px;">
        <label>Leave this field blank<input type="text" name="bot-field" /></label>
      </p>
      <input type="text" name="your-name" placeholder="Name*" required />
      <input type="email" name="your-email" placeholder="Email*" required />
      <input type="tel" name="tel-phone" placeholder="Phone*" required />
      <input type="text" name="subject" placeholder="Subject" />
      <textarea name="your-message" placeholder="Message*" required></textarea>
      <button type="submit">Send</button>
    </form>
  </body>
</html>
